<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>机械工坊</title><link rel="stylesheet" href="v27-full.css"><style>body{margin:0;padding:0;background:var(--bg,#faf6ed);background-attachment:fixed;background-size:cover;transition:background .3s}.phone-screen{max-width:420px;margin:0 auto;height:100vh;display:flex;flex-direction:column;overflow:hidden;position:relative;background:transparent}.screen-scroll{flex:1;overflow-y:auto}.view{display:none}.view.active{display:block}</style></head><body data-theme="solid-cream"><div class="phone-screen cd"><div class="screen-scroll"><div id="view-home" class="view active"><div class="cd-header"><div class="cd-brand"><span>机械工坊</span></div><div class="cd-level">⚙ Lv.<span id="st-lv">1</span></div></div><div class="cd-banner cd-banner-short"><div class="cd-banner-bg"></div><div class="cd-banner-text">今日训练</div></div><div class="stat-row cols-3"><div class="stat-card" style="--accent:#3a4a5c"><div class="stat-num" id="st-done">0</div><div class="stat-lbl">完成</div></div><div class="stat-card" style="--accent:#c9a35c"><div class="stat-num" id="st-rate">0%</div><div class="stat-lbl">正确率</div></div><div class="stat-card" style="--accent:#5a6b3a"><div class="stat-num" id="st-str">0</div><div class="stat-lbl">连对</div></div></div><div class="cd-section-label"><span>训练模式</span></div><div class="icon-grid cols-3"><div class="icon-grid-item" onclick="qz('java')"><span style="font-size:16px">☕</span><span>Java</span></div><div class="icon-grid-item" onclick="qz('python')"><span style="font-size:16px">🐍</span><span>Python</span></div><div class="icon-grid-item" onclick="qz('js')"><span style="font-size:16px">📜</span><span>JS</span></div></div><div class="tag-cloud"><span class="tag-chip" style="color:#3a4a5c;background:rgba(240,244,248,.85)"><span id="tg-java">Java 0</span></span><span class="tag-chip" style="color:#c9a35c;background:rgba(240,244,248,.85)"><span id="tg-python">Python 0</span></span><span class="tag-chip" style="color:#5a6b3a;background:rgba(240,244,248,.85)"><span id="tg-js">JS 0</span></span></div></div><div id="view-quiz" class="view"><div class="cd-header"><div class="cd-brand"><span id="qz-title">训练中</span></div></div><div class="pb-wrap"><div class="pb-bar"><div class="pb-fill" id="qz-bar" style="width:0%;background:#3a4a5c"></div></div><span class="pb-label" id="qz-label">1/5</span></div><div style="background:#2a2a28;color:#e0d8c0;padding:10px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.5;margin-bottom:8px;white-space:pre-wrap" id="qz-code"></div><div style="display:flex;gap:4px;margin-bottom:8px"><button onclick="ans('A')" style="flex:1;padding:8px;font-size:10px;background:rgba(255,255,255,.7);border:1px solid #d0d0d8;border-radius:6px;cursor:pointer;font-family:inherit">A</button><button onclick="ans('B')" style="flex:1;padding:8px;font-size:10px;background:rgba(255,255,255,.7);border:1px solid #d0d0d8;border-radius:6px;cursor:pointer;font-family:inherit">B</button><button onclick="ans('C')" style="flex:1;padding:8px;font-size:10px;background:rgba(255,255,255,.7);border:1px solid #d0d0d8;border-radius:6px;cursor:pointer;font-family:inherit">C</button><button onclick="ans('D')" style="flex:1;padding:8px;font-size:10px;background:rgba(255,255,255,.7);border:1px solid #d0d0d8;border-radius:6px;cursor:pointer;font-family:inherit">D</button></div><div id="qz-fb" style="text-align:center;font-size:11px;font-weight:600;margin-top:4px"></div></div></div><div class="cd-tabbar"><button class="active" onclick="sw('home',this)"><span style="font-size:8px">主页</span></button><button onclick="qz('java')"><span style="font-size:8px">训练</span></button><button onclick="cfg()"><span style="font-size:8px">设置</span></button></div></div><div id="dlg-cfg" style="display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.3);align-items:center;justify-content:center"><div style="background:#faf6ed;border-radius:10px;padding:16px;max-width:320px;width:90vw"><h3 style="font-family:'Cormorant Garamond',serif;font-size:15px;margin-bottom:10px">设置</h3><select id="thm" onchange="stm(this.value)" style="width:100%;padding:6px 10px;font-size:10px;border:1px solid #d8e0e0;border-radius:4px;margin-bottom:8px"><option value="solid-cream">默认</option><option value="paper-1">纸纹1</option><option value="paper-2">纸纹2</option><option value="paper-3">纸纹3</option><option value="solid-mist">薄雾</option><option value="grad-warm">暖渐变</option><option value="grad-forest">森林</option><option value="eink">墨水屏</option></select><button onclick="rtm()" style="padding:4px 12px;font-size:10px;background:#5a6b3a;color:#fff;border:none;border-radius:4px;cursor:pointer">🎲</button><button onclick="document.getElementById('dlg-cfg').style.display='none'" style="margin-left:8px;padding:4px 12px;font-size:10px;border:1px solid #c8d8d8;border-radius:4px;cursor:pointer">关闭</button></div></div><script>
var qs=[{q:'Java 中 int 默认值？',c:'int x;\nSystem.out.println(x);',a:'A',o:{A:'0',B:'null',C:'undefined',D:'编译错误'},l:'java'},{q:'Python 定义函数？',c:'# 定义函数 greet',a:'B',o:{A:'function greet():',B:'def greet():',C:'fn greet():',D:'func greet():'},l:'python'},{q:'JS typeof null 结果？',c:'console.log(typeof null);',a:'C',o:{A:'null',B:'undefined',C:'object',D:'boolean'},l:'js'},{q:'Java 继承关键字？',c:'class Dog ___ Animal { }',a:'A',o:{A:'extends',B:'inherits',C:'implements',D:'super'},l:'java'},{q:'Python 列表推导？',c:'# 0-9 平方列表',a:'D',o:{A:'[x^2 for x in 0..9]',B:'[for x in range(10): x*x]',C:'map(x->x*x,range(10))',D:'[x*x for x in range(10)]'},l:'python'}];
var qi=0,cr=0,tt=0,sk=0,ls={java:0,python:0,js:0},cl='';
function qz(l){cl=l;var qq=qs.filter(function(q){return q.l===l});if(!qq.length)return;qi=0;cr=0;var q=qq[0];document.getElementById('qz-title').textContent=l.toUpperCase()+' 训练';document.getElementById('qz-code').textContent=q.c;document.getElementById('qz-fb').textContent='';document.getElementById('qz-bar').style.width='0%';document.getElementById('qz-label').textContent='1/'+qq.length;sw('quiz')}
function ans(a){var qq=qs.filter(function(q){return q.l===cl});if(qi>=qq.length)return;var q=qq[qi];tt++;var fb=document.getElementById('qz-fb');if(a===q.a){cr++;sk++;fb.textContent='✓ 正确!';fb.style.color='#5a6b3a'}else{fb.textContent='✗ 答案 '+q.a;fb.style.color='#a04a3a';sk=0}ls[q.l]=(ls[q.l]||0)+1;var rt=tt>0?Math.round(cr/tt*100)+'%':'0%';document.getElementById('st-done').textContent=tt;document.getElementById('st-rate').textContent=rt;document.getElementById('st-str').textContent=sk;document.getElementById('st-lv').textContent=Math.floor(tt/5)+1;document.getElementById('tg-'+q.l).textContent=q.l.toUpperCase()+' '+(ls[q.l]||0);qi++;if(qi<qq.length){var nq=qq[qi];document.getElementById('qz-code').textContent=nq.c;document.getElementById('qz-bar').style.width=Math.round(qi/qq.length*100)+'%';document.getElementById('qz-label').textContent=(qi+1)+'/'+qq.length}else{setTimeout(function(){sw('home');document.querySelectorAll('.cd-tabbar button').forEach(function(b){b.classList.remove('active')});document.querySelector('.cd-tabbar button:first-child').classList.add('active')},1000)}}
function sw(v,b){document.querySelectorAll('.view').forEach(function(e){e.classList.remove('active')});document.getElementById('view-'+v).classList.add('active');if(b){document.querySelectorAll('.cd-tabbar button').forEach(function(e){e.classList.remove('active')});b.classList.add('active')}}
function cfg(){document.getElementById('dlg-cfg').style.display='flex'}
function stm(t){document.body.setAttribute('data-theme',t);localStorage.setItem('v27th',t)}
function rtm(){var a=['solid-cream','paper-1','paper-2','paper-3','solid-mist','grad-warm','grad-forest','eink'];stm(a[Math.floor(Math.random()*a.length)]);document.getElementById('thm').value=document.body.getAttribute('data-theme')}
(function(){var s=localStorage.getItem('v27th');if(s){document.body.setAttribute('data-theme',s);var e=document.getElementById('thm');if(e)e.value=s}})();
</script></body></html>
